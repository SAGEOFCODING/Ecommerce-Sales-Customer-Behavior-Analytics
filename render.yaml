# Render.com deployment blueprint
# https://render.com/docs/blueprint-spec

services:
  - type: web
    name: ecommerce-analytics-dashboard
    runtime: python
    buildCommand: pip install -r requirements.txt && python src/data_cleaner.py && python src/db_manager.py
    startCommand: gunicorn app.app:app --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
